name: Workflow Platform Enterprise CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-and-unit:
    name: "Stage 1 & 2: Static Analysis, Unit & Outbox Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build & Typecheck Monorepo
        run: npm run build

      - name: Run Unit & Outbox Tests
        run: npx vitest run tests/unit

  contracts-and-security:
    name: "Stage 3 & 4: Contract Schemas, Security Matrix & API Lifecycle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Contract Tests
        run: npx vitest run tests/contract

      - name: Run Tenant Security & Integration Tests
        run: npx vitest run tests/security tests/integration

  e2e:
    name: "Stage 5: Playwright End-to-End Tests"
    runs-on: ubuntu-latest
    needs: [static-and-unit, contracts-and-security]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

