global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'workflow-api'
    static_configs:
      - targets: ['host.docker.internal:3000', 'workflow-api:3000']
  - job_name: 'notification-service'
    static_configs:
      - targets: ['host.docker.internal:3001', 'notification-service:3001']
  - job_name: 'audit-service'
    static_configs:
      - targets: ['host.docker.internal:3002', 'audit-service:3002']

