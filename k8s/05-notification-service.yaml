apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: workflow-platform
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: docker.io/library/notification-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              value: "3001"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: KAFKA_BROKERS
            - name: KAFKA_GROUP_ID
              value: "notification-service-group"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: workflow-platform
  labels:
    app: notification-service
spec:
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: notification-service
