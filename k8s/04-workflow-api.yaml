apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-api
  namespace: workflow-platform
  labels:
    app: workflow-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-api
  template:
    metadata:
      labels:
        app: workflow-api
    spec:
      containers:
        - name: workflow-api
          image: docker.io/library/workflow-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: WORKFLOW_DB_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: KAFKA_BROKERS
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: ADMIN_TOKEN
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-api
  namespace: workflow-platform
  labels:
    app: workflow-api
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: workflow-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workflow-api-hpa
  namespace: workflow-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workflow-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
