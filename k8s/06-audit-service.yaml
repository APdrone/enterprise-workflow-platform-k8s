apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: workflow-platform
  labels:
    app: audit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: docker.io/library/audit-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-secrets
                  key: AUDIT_DB_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: KAFKA_BROKERS
            - name: KAFKA_GROUP_ID
              value: "audit-service-group"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: workflow-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: workflow-platform
  labels:
    app: audit-service
spec:
  ports:
    - port: 3002
      targetPort: 3002
      name: http
  selector:
    app: audit-service
