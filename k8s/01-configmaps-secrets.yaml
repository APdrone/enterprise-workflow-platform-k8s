apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-config
  namespace: workflow-platform
data:
  NODE_ENV: "production"
  KAFKA_BROKERS: "kafka.workflow-platform.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "workflow-k8s-client"
  KAFKA_EVENTS_TOPIC: "workflow.events"
  PORT_WORKFLOW_API: "3000"
  PORT_NOTIFICATION: "3001"
  PORT_AUDIT: "3002"
  PORT_HOST_APP: "5173"
  VITE_API_BASE_URL: "/api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.workflow-platform.svc.cluster.local:4318/v1/traces"
---
apiVersion: v1
kind: Secret
metadata:
  name: workflow-secrets
  namespace: workflow-platform
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  POSTGRES_HOST: "postgres.workflow-platform.svc.cluster.local"
  POSTGRES_PORT: "5432"
  WORKFLOW_DB_URL: "postgresql://postgres:postgrespassword@postgres.workflow-platform.svc.cluster.local:5432/workflow_db"
  AUDIT_DB_URL: "postgresql://postgres:postgrespassword@postgres.workflow-platform.svc.cluster.local:5432/audit_db"
  ADMIN_TOKEN: "workflow-k8s-admin-token-2026"
