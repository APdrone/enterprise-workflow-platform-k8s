apiVersion: v1
kind: ConfigMap
metadata:
  name: host-app-nginx-config
  namespace: workflow-platform
  labels:
    app: host-app
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-app
  namespace: workflow-platform
  labels:
    app: host-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: host-app
  template:
    metadata:
      labels:
        app: host-app
    spec:
      containers:
        - name: host-app
          image: docker.io/library/host-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: nginx-conf
          configMap:
            name: host-app-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: host-app
  namespace: workflow-platform
  labels:
    app: host-app
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: host-app
